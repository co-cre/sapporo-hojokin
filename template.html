<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SITE_NAME__｜毎朝更新</title>
<meta name="description" content="__LEAD__">
<style>
:root { --ink:#1a1a1a; --sub:#6b6b6b; --line:#e2e2e2; --accent:#0b6e4f; --bg:#ffffff; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.7; }
.wrap { max-width:760px; margin:0 auto; padding:40px 16px 80px; }
h1 { font-size:22px; font-weight:600; letter-spacing:.04em; margin:0 0 8px; }
.lead { color:var(--sub); font-size:14px; margin:0 0 28px; }
.count { font-size:15px; margin:0 0 4px; }
.count b { font-size:32px; font-weight:600; color:var(--accent); margin-right:4px; }
.updated { color:var(--sub); font-size:12px; margin:0 0 20px; }
.line { margin:0 0 28px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.line a { color:var(--accent); font-weight:600; text-decoration:none; }
.line a::after { content:" →"; }
input[type=search] { width:100%; font-size:16px; padding:12px 0; border:0; border-bottom:1px solid var(--ink); outline:none; background:transparent; }
.filters { display:flex; gap:20px; margin:16px 0 8px; font-size:14px; flex-wrap:wrap; }
.filters button { background:none; border:0; padding:4px 0; font:inherit; color:var(--sub); cursor:pointer; border-bottom:1px solid transparent; }
.filters button[aria-pressed=true] { color:var(--ink); border-bottom-color:var(--ink); }
ul.list { list-style:none; margin:16px 0 0; padding:0; }
ul.list li { border-top:1px solid var(--line); padding:18px 0; }
ul.list li:last-child { border-bottom:1px solid var(--line); }
.meta { font-size:12px; color:var(--sub); display:flex; gap:12px; flex-wrap:wrap; }
.meta .lv { color:var(--ink); letter-spacing:.08em; }
.meta .soon { color:#b3261e; }
.t { display:block; margin:4px 0; color:var(--ink); text-decoration:none; font-size:15px; }
.t:hover { text-decoration:underline; }
.empty { color:var(--sub); padding:24px 0; }
footer { margin-top:56px; font-size:12px; color:var(--sub); }
footer ul { padding-left:18px; margin:6px 0 16px; }
footer a { color:var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <h1>__SITE_NAME__</h1>
  <p class="lead">__LEAD__</p>
  <p class="count"><b id="n">0</b>件 掲載中</p>
  <p class="updated">最終更新 __UPDATED__（毎朝6時ごろ自動更新。札幌市・北海道の新しい公募も毎朝の更新で加わります）</p>
  __LINE__
  <input type="search" id="q" placeholder="キーワードで探す（例: IT導入、省エネ、人材）" aria-label="キーワードで探す">
  <div class="filters" role="group" aria-label="実施する機関で絞る">
    <button data-lv="" aria-pressed="true">すべて</button>
    <button data-lv="市" aria-pressed="false">札幌市</button>
    <button data-lv="道" aria-pressed="false">北海道</button>
    <button data-lv="国" aria-pressed="false">国</button>
  </div>
  <ul class="list" id="list"></ul>
  <footer>
    <p>締切・金額・対象は必ず各リンク先の公式情報で確かめてください。このページは公式情報へのリンク集で、内容を保証するものではありません。</p>
    出典
    <ul>__SOURCES__</ul>
    <p>運営: __OPERATOR__</p>
  </footer>
</div>
<script>
const ITEMS = __DATA__;
const LV = { "国":"国", "道":"北海道", "市":"札幌市", "その他":"北海道" };
const SRC = { jgrants:"jGrants", hokkaido:"北海道庁", sapporo:"札幌市", jnet21:"J-Net21" };
let level = "";
const fmtDate = s => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtYen = n => n >= 1e8 ? `${(n/1e8).toLocaleString()}億円` : n >= 1e4 ? `${Math.round(n/1e4).toLocaleString()}万円` : `${n.toLocaleString()}円`;
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const now = Date.now();
  const shown = ITEMS.filter(it => (!it.end || new Date(it.end) >= now)
    && (!level || it.level === level || (level === "道" && it.level === "その他"))
    && (!q || (it.title + it.org).toLowerCase().includes(q)));
  document.getElementById("n").textContent = shown.length;
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  if (!shown.length) { ul.innerHTML = '<li class="empty">見つかりませんでした。言葉を変えてお試しください。</li>'; return; }
  for (const it of shown) {
    const li = document.createElement("li");
    const meta = document.createElement("div"); meta.className = "meta";
    const add = (text, cls) => { const s = document.createElement("span"); s.textContent = text; if (cls) s.className = cls; meta.append(s); };
    add(LV[it.level] || it.level, "lv");
    if (it.end) { const days = (new Date(it.end) - now) / 864e5; add(`締切 ${fmtDate(it.end)}`, days < 14 ? "soon" : ""); }
    else if (it.published) add(`掲載 ${fmtDate(it.published)}`);
    if (it.max_amount) add(`上限 ${fmtYen(it.max_amount)}`);
    add(`出典 ${SRC[it.source]}`);
    const a = document.createElement("a"); a.className = "t"; a.href = it.url; a.rel = "noopener"; a.target = "_blank"; a.textContent = it.title;
    li.append(meta, a);
    if (it.org) { const o = document.createElement("div"); o.className = "meta"; o.textContent = it.org; li.append(o); }
    ul.append(li);
  }
}
document.getElementById("q").addEventListener("input", render);
document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  level = b.dataset.lv;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
render();
</script>
</body>
</html>
